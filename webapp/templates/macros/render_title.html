{% macro render_title(title) %}
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin: 0px;">
        <a href="/" style="flex-shrink: 0; margin: 0;">
            <img src="/webapp/static/logo.png"
                 alt="Logo"
                 class="logo">
        </a>
        <h1 style="flex-grow: 1; text-align: center; margin: 0;">{{ title }}</h1>
        <div class="counter_logo"></div>
    </div>

    <div class="lang-container">
        <button class="lang-button" onclick="toggleLangMenu()" aria-haspopup="true" aria-expanded="false">
            {{ (lang_code or 'en')|upper }}
        </button>
        <div id="lang-menu" class="lang-menu" role="menu">
            <a role="menuitem" href="{{ url_for('routes.set_lang', code='en') }}" class="{{ 'active' if lang_code=='en' else '' }}">EN</a>
            <a role="menuitem" href="{{ url_for('routes.set_lang', code='fr') }}" class="{{ 'active' if lang_code=='fr' else '' }}">FR</a>
        </div>
    </div>

    <div id="progress-loading-overlay">
        <div class="progress-loading-box">
            <div class="progress-loading-text">Loading progress…</div>
            <div class="progress-loading-bar">
                <div class="progress-loading-bar-inner"></div>
            </div>
        </div>
    </div>

    <div class="hamburger-container">
        <button class="hamburger" onclick="toggleMenu()">☰</button>
        <div id="menu" class="menu">
            <a href="/">Home</a>

            {% if current_user.is_authenticated %}
                <a href="{{ url_for('routes.progress') }}" class="progress-link">Progress</a>
                <a href="{{ url_for('routes.bookmarks') }}">Bookmarks</a>
                <a href="{{ url_for('routes.settings') }}">Settings</a>
            {% else %}
                <a href="{{ url_for('routes.signin') }}">Login</a>
                <a href="{{ url_for('routes.progress') }}" class="progress-link">Progress</a>
                <a href="{{ url_for('routes.settings') }}">Settings</a>
            {% endif %}

            <a href="/about">About</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/menu/toggleMenu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/menu/toggleLanguage.js') }}"></script>

    <script>
        document.querySelectorAll(".progress-link").forEach(link => {
            link.addEventListener("click", function(event) {
                event.preventDefault();

                const href = this.href;
                const overlay = document.getElementById("progress-loading-overlay");

                overlay.classList.add("visible");

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        window.location.href = href;
                    });
                });
            });
        });
    </script>

{% endmacro %}
