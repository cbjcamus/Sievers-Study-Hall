services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sievers-study-hall-dev
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_SECRET_KEY=dev-secret-key-not-for-production
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/instance
    networks:
      - sievers-network
    command: flask run --host=0.0.0.0

networks:
  sievers-network:
    driver: bridge
